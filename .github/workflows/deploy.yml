name: Deploy to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Deploy to Firebase
        run: npx firebase-tools@15.26.0 deploy --only hosting,firestore:rules,firestore:indexes,functions --project pilates-app-98885 --token "${{ secrets.FIREBASE_TOKEN }}"
