name: Deploy backend to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Deploy Firebase backend
        run: npx firebase-tools@15.26.0 deploy --only firestore:rules,firestore:indexes,functions --project pilates-app-98885 --token "${{ secrets.FIREBASE_TOKEN }}"
